name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-validation:
    name: Linux validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install npm dependencies (future)
        if: ${{ hashFiles('package.json') != '' && hashFiles('package-lock.json') != '' }}
        run: npm ci

      - name: Run npm test (future)
        if: ${{ hashFiles('package.json') != '' && hashFiles('package-lock.json') != '' }}
        run: npm test

      - name: Run npm build (future)
        if: ${{ hashFiles('package.json') != '' && hashFiles('package-lock.json') != '' }}
        run: npm run build

      - name: Report skipped npm checks
        if: ${{ hashFiles('package.json') == '' || hashFiles('package-lock.json') == '' }}
        run: echo "::notice::Future npm checks skipped until package.json and package-lock.json are present."

      - name: Verify Docker build (future)
        if: ${{ hashFiles('Dockerfile') != '' && hashFiles('package.json') != '' && hashFiles('package-lock.json') != '' }}
        run: docker build --file Dockerfile --tag buildmedic:ci .

      - name: Report skipped Docker check
        if: ${{ hashFiles('Dockerfile') == '' || hashFiles('package.json') == '' || hashFiles('package-lock.json') == '' }}
        run: echo "::notice::Future Docker build verification skipped until Dockerfile, package.json, and package-lock.json are present."
