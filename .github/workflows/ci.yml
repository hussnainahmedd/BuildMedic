name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-validation:
    name: Linux validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install npm dependencies
        run: npm ci

      - name: Run npm test
        run: npm test

      - name: Run npm lint
        run: npm run lint

      - name: Run npm build
        run: npm run build

      - name: Build Docker image
        run: docker build --pull --file Dockerfile --tag buildmedic:ci .

      - name: Start container and run HTTP smoke check
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name buildmedic-ci --publish 4173:4173 buildmedic:ci
          cleanup() {
            docker logs buildmedic-ci || true
            docker stop buildmedic-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/health; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Container health check timed out."
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error http://127.0.0.1:4173/ | grep --fixed-strings --quiet "BuildMedic"
