name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-validation:
    name: Linux validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js 22 from .nvmrc
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc

      - name: Install npm dependencies
        run: npm ci

      - name: Run npm test
        run: npm test

      - name: Run npm lint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run npm build
        run: npm run build

      - name: Audit dependency advisories
        run: npm audit --audit-level=high

      - name: Run bounded synthetic benchmarks
        run: npm run benchmark

      - name: Build Docker image
        run: docker build --pull --file Dockerfile --tag buildmedic:ci .

      - name: Build isolated browser QA image
        run: docker build --file Dockerfile --target browser-qa --tag buildmedic:browser-ci .

      - name: Start non-root production container and run HTTP and real-browser checks
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name buildmedic-ci --publish 4173:4173 buildmedic:ci
          cleanup() {
            docker logs buildmedic-ci || true
            docker stop buildmedic-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/health; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Container health check timed out."
              exit 1
            fi
            sleep 2
          done

          node tests/production-smoke.mjs http://127.0.0.1:4173
          test "$(docker inspect --format '{{.Config.User}}' buildmedic-ci)" = "buildmedic"
          mkdir -p .cache/browser-results
          docker run --rm --network host --shm-size=1g \
            --env BUILDMEDIC_BASE_URL=http://127.0.0.1:4173 \
            --volume "$PWD/.cache/browser-results:/app/.cache/browser-results" \
            buildmedic:browser-ci

      - name: Retain synthetic browser screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 (Node 24)
        with:
          name: browser-qa-evidence
          path: .cache/browser-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
